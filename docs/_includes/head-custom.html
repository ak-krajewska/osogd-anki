<meta name="robots" content="noindex, nofollow">
<style>
  /* The primer theme defines no .btn style, so the download links need one.
     Colours match primer's own palette (link blue #0366d6 on white). */
  .btn {
    display: inline-block;
    padding: 0.7em 1.3em;
    background-color: #0366d6;
    color: #fff;
    border-radius: 6px;
    font-size: 1.1em;
    font-weight: 600;
    line-height: 1.4;
    text-decoration: none;
  }

  .btn:hover,
  .btn:focus {
    background-color: #0256b4;
    color: #fff;
    text-decoration: none;
  }

  .btn:focus-visible {
    outline: 2px solid #0366d6;
    outline-offset: 2px;
  }
</style>
